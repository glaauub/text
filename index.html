<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Export Site</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header"><div class="container"><span class="logo">My Export Site</span></div></header>
<section class="banner-section"><div class="banner-slider"><div class="slide active"><img src="static/uploads/a96319732c8f4fe1bebe7eb34754b46d.webp" alt="Banner 1"></div></div></section>
<section class="products-section"><div class="container"><h2 class="section-title">我们的产品</h2><div class="product-grid"><div class="product-card"><div class="product-img"><img src="static/uploads/1354a9e347b54dfdaa7baa303df0bf39.webp" alt="1" loading="lazy"></div><div class="product-body"><h3 class="product-name">1</h3><div class="product-price">10</div><div class="product-spec">10*4cm</div></div></div></div></div></section>
<section class="contact-section"><div class="container"><h2 class="section-title">联系我们</h2><div class="contact-list"><a class="contact-btn" href="https://wa.me/8613800138000"><span class="contact-icon">📱</span>WhatsApp</a><a class="contact-btn" href="javascript:void(0)" onclick="copyText('999')"><span class="contact-icon">💬</span>微信</a></div></div></section>
<footer class="site-footer">© 2026 My Export Site</footer>
<script>
var idx = 0;
var slides = document.querySelectorAll('.banner-slider .slide');
function nextSlide() {
  if (!slides.length) return;
  slides[idx].classList.remove('active');
  idx = (idx + 1) % slides.length;
  slides[idx].classList.add('active');
}
if (slides.length > 1) setInterval(nextSlide, 3500);
function copyText(t) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(t).then(function() { alert('已复制: ' + t); });
  } else {
    prompt('请手动复制:', t);
  }
}
</script>
</body>
</html>
